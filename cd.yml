name: CD

on:
  workflow_run:          # CI 跑完再触发
    workflows: ["CI"]
    branches: [cloud]
    types: [completed"]

env:
  IMAGE: registry.cn-chengdu.aliyuncs.com/zrqpublic/fn-monitor
  CONTAINER: fn-monitor

jobs:
  deploy:
    runs-on: jump-zrq    # 关键：只落在你自己的这台机器
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Pull latest image
        run: docker pull ${{ IMAGE }}:${{ github.sha }}

      - name: Stop & remove old container
        run: |
          docker stop ${{ CONTAINER }} || true
          docker rm   ${{ CONTAINER }} || true

      - name: Start new container
        run: |
          docker run -d --restart=unless-stopped \
            -p 7733:7733 \
            -v /tmp:/tmp:ro \
            --name ${{ CONTAINER }} \
            ${{ IMAGE }}:${{ github.sha }}

      - name: Health check
        run: |
          for i in {1..10}; do
            nc -z 127.0.0.1 7733 && echo 'Service UP' && exit 0
            sleep 2
          done
          echo 'Health check failed' && exit 1